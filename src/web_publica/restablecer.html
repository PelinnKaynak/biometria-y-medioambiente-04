<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva contraseña · AERIS</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/acceso.css">
</head>
<body class="pagina-acceso">

<a class="boton-volver" href="login.html">‹ Iniciar sesión</a>

<main class="tarjeta-acceso">

    <section class="panel-logo" aria-hidden="true">
        <img src="img/logo-aeris.svg" alt="" class="logo-grande">
    </section>

    <section class="panel-formulario">
        <img src="img/logo-aeris.svg" alt="AERIS" class="logo-movil">

        <!-- Paso 1: escribir la contraseña nueva -->
        <div id="paso-formulario">
            <h1>Nueva contraseña</h1>
            <p class="texto-explicacion">
                Elige una contraseña de al menos 8 caracteres, con al menos una letra y un número.
            </p>

            <form id="formulario-restablecer" class="formulario-acceso" novalidate>
                <label for="contrasena">Contraseña nueva</label>
                <div class="campo-con-icono">
                    <input id="contrasena" name="contrasena" type="password" class="campo"
                           placeholder="contraseña nueva" autocomplete="new-password" required>
                    <button type="button" class="boton-ojo" data-campo="contrasena"
                            aria-label="Mostrar contraseña" aria-pressed="false">
                        <img src="img/ojo-cerrado.svg" alt="">
                    </button>
                </div>

                <label for="repetida">Repite la contraseña</label>
                <div class="campo-con-icono">
                    <input id="repetida" name="repetida" type="password" class="campo"
                           placeholder="repite la contraseña" autocomplete="new-password" required>
                    <button type="button" class="boton-ojo" data-campo="repetida"
                            aria-label="Mostrar contraseña" aria-pressed="false">
                        <img src="img/ojo-cerrado.svg" alt="">
                    </button>
                </div>

                <p id="mensaje-error" class="mensaje-error oculto" role="alert">
                    <span aria-hidden="true">⚠</span>
                    <span id="texto-error"></span>
                </p>

                <button type="submit" class="boton boton-acceder boton-ancho">Guardar contraseña</button>

                <a id="enlace-pedir-otro" href="recuperar.html" class="enlace-recuperar enlace-centrado oculto">
                    Pedir un enlace nuevo
                </a>
            </form>
        </div>

        <!-- Paso 2: contraseña cambiada -->
        <div id="paso-hecho" class="paso-enviado oculto" aria-live="polite">
            <div class="icono-sobre"><img src="img/hecho.svg" alt=""></div>
            <h1>Contraseña cambiada</h1>
            <p class="texto-explicacion">
                Ya puedes iniciar sesión con tu contraseña nueva, en la web y en la app.
            </p>
            <a href="login.html" class="boton boton-acceder boton-ancho">Iniciar sesión</a>
        </div>
    </section>

</main>

<script src="js/logica_fake.js"></script>
<script src="js/logica_real.js"></script>
<script src="js/configuracion.js"></script>
<script src="js/validacion.js"></script>
<script src="js/restablecer.js"></script>
</body>
</html>
