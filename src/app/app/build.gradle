plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.aeris'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.aeris"
        minSdk 29
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'   // escáner de códigos (Vincular sensor)
    testImplementation libs.junit
    testImplementation 'org.json:json:20240303'   // org.json real para los tests locales
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}