plugins {
    alias(libs.plugins.android.application)
}

// Dirección del servidor REST que usa la app (BuildConfig.URL_SERVIDOR). Sin configurar, el
// servidor compartido de la UPV. Para el emulador: aeris.url=http://10.0.2.2:8080; para un teléfono
// real: aeris.url=http://<IPv4 del ordenador>:8080. Se pone en local.properties (no se versiona)
// o con -Paeris.url=... al compilar.
def propiedadesLocales = new Properties()
def ficheroLocal = rootProject.file('local.properties')
if (ficheroLocal.exists()) {
    ficheroLocal.withInputStream { propiedadesLocales.load(it) }
}
def urlServidor = (providers.gradleProperty('aeris.url').orNull
        ?: propiedadesLocales.getProperty('aeris.url')
        ?: 'https://pfermar1.upv.edu.es').trim()

android {
    namespace 'com.example.aeris'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.aeris"
        minSdk 29
        targetSdk 37
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'URL_SERVIDOR', '"' + urlServidor + '"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.splashscreen
    implementation libs.osmdroid

    // Escáner propio del código de la etiqueta (Vincular sensor, T039): cámara y lector de DataMatrix
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.3'   // segundo lector, para el DataMatrix pequeño de la etiqueta

    testImplementation libs.junit
    testImplementation 'org.json:json:20240303'   // org.json real para los tests locales
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
